# src/api/client.js가 baseURL을 상대경로("/api/v1")로 하드코딩해두고 있어서
# (README.md 12-5절 참고, Phase 0 infra 미완 항목) 프론트를 서빙하는 이 nginx가
# /api/v1로 오는 요청을 백엔드로 넘겨줘야 브라우저에서 API 호출이 붙는다.
#
# BACKEND_HOST / BACKEND_PORT는 docker-compose.yml에서 실제 백엔드 서비스명으로
# 바꿔서 주입한다 (지금은 자리표시자값).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router(SPA) — 새로고침/직접 URL 진입 시 index.html로 폴백
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 백엔드 API 프록시
    location /api/v1/ {
        proxy_pass http://backend:8080/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
