# src/api/client.js가 baseURL을 상대경로("/api/v1")로 하드코딩해두고 있어서
# (README.md 12-5절 참고, Phase 0 infra 미완 항목) 프론트를 서빙하는 이 nginx가
# /api/v1로 오는 요청을 백엔드로 넘겨줘야 브라우저에서 API 호출이 붙는다.
#
# 지금 proxy_pass 대상(backend:8000)은 docker-compose.yml의 `backend` 서비스 =
# mock-backend/(Django 목 서버)다. 실제 백엔드로 교체될 때 포트/서비스명도 같이 바꿀 것.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router(SPA) — 새로고침/직접 URL 진입 시 index.html로 폴백
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 백엔드 API 프록시
    location /api/v1/ {
        proxy_pass http://backend:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
